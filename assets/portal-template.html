    const props=document.createElement('div');props.className='detail-section detail-grid';for(const [k,v] of [['文件 ID',f.file_id],['资料类型',f.document_type_label||'未确认'],['格式',f.extension||'未知'],['词表复核',f.vocabulary_review_required?'需要复核':'无待办'],['大小',f.size_human||''],['分类依据',f.classification_basis_label||'未记录'],['业务状态',f.business_state_label||'未确认'],['文档版本',f.version_label||'未确认'],['版本组',f.version_group||'未确认'],['当前版本',f.is_current?'生成时的指定版本':'未指定'],['复核日期',f.review_on||'未设置']]){const cell=document.createElement('div');const l=document.createElement('div');l.className='detail-label';text(l,k);const val=document.createElement('div');val.className='detail-value';text(val,v);cell.append(l,val);props.append(cell)}box.append(props);
    if(f.summary){const s=document.createElement('section');s.className='detail-section';const l=document.createElement('div');l.className='detail-label';text(l,f.semantic_status==='partial'?'部分内容摘要':'内容摘要');const t=document.createElement('div');t.className='detail-text';text(t,f.summary);s.append(l,t);box.append(s)}else if(f.legacy_note){const s=document.createElement('section');s.className='detail-section';const l=document.createElement('div');l.className='detail-label';text(l,'目录 / 文件名说明');const t=document.createElement('div');t.className='detail-text';text(t,f.legacy_note);s.append(l,t);box.append(s)}
    const tags=(f.tags||[]).filter(t=>t.facet!=='file_type');if(tags.length){const s=document.createElement('section');s.className='detail-section';const l=document.createElement('div');l.className='detail-label';text(l,'标签');const t=document.createElement('div');t.className='tag-list';for(const tag of tags){const x=document.createElement('span');x.className='tag';text(x,tag.facet+' · '+tag.label);x.title=[tag.definition,tag.aliases?.length?'别名：'+tag.aliases.join('、'):''].filter(Boolean).join('；');t.append(x)}s.append(l,t);box.append(s)}
    const ev=(f.evidence||[]);if(ev.length){const s=document.createElement('section');s.className='detail-section';const l=document.createElement('div');l.className='detail-label';text(l,'分类 / 摘要依据');const list=document.createElement('div');list.className='source-list';for(const e of ev){const x=document.createElement('div');x.className='source-item';text(x,safeSource(e));list.append(x)}s.append(l,list);box.append(s)}
    if(f.read_coverage||f.issue_message){const s=document.createElement('section');s.className='detail-section';const l=document.createElement('div');l.className='detail-label';text(l,'读取范围 / 限制');const t=document.createElement('div');t.className='detail-text';text(t,[f.read_coverage,f.issue_message].filter(Boolean).join('\n'));s.append(l,t);box.append(s)}
    const actions=document.createElement('section');actions.className='detail-section copy-row';const a=document.createElement('a');a.href=escPath(f.path);a.textContent='打开原文件';a.className='copy-button';a.rel='noreferrer';a.addEventListener('click',e=>{if(!f.path||f.path.split('/').includes('..'))e.preventDefault()});const copy=document.createElement('button');copy.type='button';copy.className='copy-button';text(copy,'复制来源');const state=document.createElement('span');state.className='copy-state';copy.addEventListener('click',async()=>{const citation=`来源：${f.path}；file_id=${f.file_id}；原文页/行定位需核验`;try{await navigator.clipboard.writeText(citation);text(state,'已复制')}catch{text(state,citation)}});actions.append(a,copy,state);box.append(actions);
  }
  function renderFiles(){const all=matches(),start=page*pageSize,shown=all.slice(start,start+pageSize),body=$('file-rows');body.replaceChildren();for(const f of shown){const tr=document.createElement('tr');tr.className='file-row';tr.tabIndex=0;tr.setAttribute('aria-selected',String(selected===f.file_id));const main=document.createElement('td');const title=document.createElement('div');title.className='file-title';text(title,f.title||f.name);const path=document.createElement('span');path.className='file-path';text(path,f.path);main.append(title,path);const meta=document.createElement('td');const cl=document.createElement('span');cl.className='badge';text(cl,f.classification_label||f.classification_status||'待分类');meta.append(cl);const tags=document.createElement('div');tags.className='tag-list';for(const tag of (f.tags||[]).slice(0,3)){const s=document.createElement('span');s.className='tag';text(s,tag.label);tags.append(s)}meta.append(tags);const read=document.createElement('td');const status=document.createElement('span');status.className='badge '+(f.semantic_status==='reviewed'?'good':f.semantic_status==='unreviewed'?'warn':'');text(status,f.semantic_label||f.semantic_status||'未知');read.append(status);tr.append(main,meta,read);tr.addEventListener('click',()=>{selected=f.file_id;detail(f);renderFiles()});tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tr.click()}});body.append(tr)}$('empty-files').classList.toggle('hidden',all.length>0);text($('empty-files'),all.length?'':'没有符合当前筛选条件的文件。');text($('result-count'),`${fmt(all.length)} 项`);text($('page-label'),all.length?`${fmt(start+1)}–${fmt(Math.min(start+pageSize,all.length))} / ${fmt(all.length)}`:'0 项');$('previous').disabled=page===0;$('next').disabled=start+pageSize>=all.length;if(!shown.some(f=>f.file_id===selected)){selected=shown[0]?.file_id||null;if(selected)detail(shown[0]);else{$('inspector').replaceChildren();text($('inspector'),'没有符合条件的文件。')}}}
  renderFolderNavigation();
  function renderIssues(){const selectedReason=$('issue-filter').value;const rows=issues.filter(x=>!selectedReason||x.reason_code===selectedReason);$('issues').replaceChildren();for(const i of rows){const row=document.createElement('article');row.className='issue';const left=document.createElement('div');const p=document.createElement('div');p.className='issue-path';text(p,i.path);const reason=document.createElement('div');reason.className='issue-reason';text(reason,i.reason_label||i.reason_code);const message=document.createElement('div');message.className='issue-next';text(message,i.message);const next=document.createElement('div');next.className='issue-next';text(next,'下一步：'+(i.next_action||''));left.append(p,reason,message,next);const right=document.createElement('div');right.className='issue-state';text(right,(i.certainty_label||i.certainty)+' · '+(i.semantic_label||i.semantic_status||''));row.append(left,right);$('issues').append(row)}$('empty-issues').classList.toggle('hidden',rows.length>0);text($('empty-issues'),rows.length?'':'当前没有待处理项。');text($('issue-result-count'),`${fmt(rows.length)} 项`)}
  for(const e of ['input','change']){$('q').addEventListener(e,()=>{page=0;renderFiles()});for(const id of ['category-filter','type-filter','format-filter','topic-filter','status-filter','business-filter'])$(id).addEventListener(e,()=>{page=0;renderFiles()})}$('issue-filter').addEventListener('change',renderIssues);$('previous').addEventListener('click',()=>{page=Math.max(0,page-1);renderFiles()});$('next').addEventListener('click',()=>{page++;renderFiles()});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('file-view').classList.toggle('hidden',view!=='files');$('issue-view').classList.toggle('hidden',view!=='issues')}));renderFiles();renderIssues();
})();
