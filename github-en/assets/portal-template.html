  const safeSource = e => String(e.locator || '') + ' · ' + String(e.basis || '');
  function option(select, value, label) { const o=document.createElement('option'); o.value=value; text(o,label); select.append(o); }
  function applyLanguage() {
    document.documentElement.lang = locale;
    $('language-switch').value = locale;
    document.querySelectorAll('[data-i18n]').forEach(n => text(n, t(n.dataset.i18n)));
    document.querySelectorAll('[data-i18n-placeholder]').forEach(n => n.placeholder = t(n.dataset.i18nPlaceholder));
    document.querySelectorAll('[data-i18n-aria]').forEach(n => n.setAttribute('aria-label', t(n.dataset.i18nAria)));
    renderHeader(); renderIssueFilter(); renderFolderNavigation(); renderStats(); renderFiles(); renderIssues();
  }
  function stateLabel(code) {
    const map = {unknown:'unknown',draft:'draft',in_review:'inReview',active:'active',completed:'completed',superseded:'superseded',archived:'archived'};
    return map[code] ? t(map[code]) : t('unknown');
  }
  function classLabel(f) {
    const map = {inherited:'inheritedUnclassified',confident:'classificationConfident',review:'needsClassificationReview',unknown:'unclassified',unclassified:'unclassified'};
    return map[f.classification_status] ? t(map[f.classification_status]) : (f.classification_label || t('unclassified'));
  }
  function semanticLabel(f) {
    const map = {reviewed:'reviewed',partial:'partiallyReviewed',unreviewed:'notReviewed',unavailable:'unavailable'};
    return map[f.semantic_status] ? t(map[f.semantic_status]) : (f.semantic_label || t('unknown'));
  }
  function extractionLabel(f) {
    const map = {text_cached:'extractionText',partial_format:'extractionPartial',truncated:'extractionTruncated',unsupported:'extractionUnsupported',size_limit:'extractionLimit',empty_or_ocr_required:'extractionOcr',encrypted:'extractionEncrypted',error:'extractionError',encoding_required:'extractionEncoding',read_error:'extractionError'};
    return map[f.extraction_status] ? t(map[f.extraction_status]) : (f.extraction_label || t('unknownParse'));
  }
  const categories = new Map(), types = new Set(), topics = new Map(), formats = new Set(), issueTypes = new Map();
  for (const f of files) {
    if (f.category_label) categories.set(f.category_id, f.category_label);
    if (f.extension) formats.add(f.extension);
    for (const tag of (f.tags || [])) {
      if (['document_type','file_type'].includes(tag.facet)) types.add(tag.label);
      if (tag.facet === 'topic') topics.set(tag.id, tag.label);
    }
  }
  for (const i of issues) issueTypes.set(i.reason_code, i.reason_label || i.reason_code);
  [...categories].sort((a,b)=>a[1].localeCompare(b[1],locale)).forEach(([id,label])=>option($('category-filter'),id,label));
  [...types].sort((a,b)=>a.localeCompare(b,locale)).forEach(v=>option($('type-filter'),v,v));
  [...formats].sort().forEach(v=>option($('format-filter'),v,v));
  [...topics].sort((a,b)=>a[1].localeCompare(b[1],locale)).forEach(([id,label])=>option($('topic-filter'),id,label));
  [...issueTypes].sort((a,b)=>a[1].localeCompare(b[1],locale)).forEach(([id,label])=>option($('issue-filter'),id,label));
  const issueText = {
    unsupported_format:{en:['Unsupported format','No parser for this format is available in the current environment; body text was not extracted.','Use an available host tool to read or convert the file, or ask the user to save it in a supported format and retry.'],zh:['格式暂不支持','当前运行环境没有可读取此格式的解析器；尚未提取正文。','使用宿主已有工具转换或读取，或请用户另存为受支持格式后重试。']},
    size_limit:{en:['Size limit','The file or extracted text exceeds the current read limit; the body may be unread or only partially covered.','Check the format and size, then read in chunks or adjust limits based on available resources.'],zh:['超过读取上限','文件或提取文本超过本轮读取限制；正文可能未读或只覆盖部分内容。','先检查文件格式与大小，再分块读取或按可用资源调整限制。']},
    truncated:{en:['Truncated text','Extracted text exceeded the cache limit; the current cache does not contain the full text.','Extract in chunks and record the exact coverage before retrying.'],zh:['文本已截断','提取文本超过缓存上限；当前缓存不包含全文。','分块提取并记录具体覆盖范围后重试。']},
    empty_or_ocr_required:{en:['No text / OCR may be needed','No usable text was extracted. Scans, images, blank documents, or format limitations may explain this.','Inspect representative pages; use available OCR when needed and verify its output.'],zh:['无可用文字 / 可能需要 OCR','当前未提取到可用文字；扫描件、图片、空白文档或格式限制都可能导致此情况。','检查代表页面；需要时使用可用 OCR 并核对识别结果。']},
    encoding_required:{en:['Encoding review','The file encoding is not compatible with the current UTF-8 reader; this does not prove the file is corrupt.','Identify the encoding and retry with an authorized local decoder.'],zh:['需要确认编码','文件编码与当前 UTF-8 读取方式不兼容；这不能证明文件损坏。','确定编码后，使用获准的本地解码器重新读取。']},
    partial_format:{en:['Partial format coverage','Some text was extracted, but layout, images, charts, comments, or non-body content may be missing.','Check important fields in the original page or slide, or render the file with a host tool.'],zh:['部分格式内容未覆盖','已提取部分文字；版式、图片、图表、批注或非正文内容可能未覆盖。','查看原文件中的重要页面或幻灯片，必要时用宿主渲染核对。']},
    encrypted:{en:['Encrypted file','The file is encrypted; its body was not read.','Ask the user to unlock it or provide a readable copy, then retry.'],zh:['加密文件','文件受加密保护，当前未读取正文。','请用户解锁或提供可读副本后重试。']},
    read_error:{en:['Read error','The read failed; check the recorded error for details.','Confirm that the file is accessible and stable, then retry; inspect for corruption if needed.'],zh:['读取失败','本轮读取失败；具体原因需要结合错误记录确认。','确认文件可访问且状态稳定后重试，必要时检查文件是否损坏。']},
    classification_needed:{en:['Classification needed','The file has no valid classification record.','Classify it from available evidence; ask the user when evidence is insufficient.'],zh:['需要分类','文件尚无有效分类档案。','依据可读取证据分类；证据不足时询问用户。']},
    classification_review:{en:['Classification review','The existing classification needs review; see the recorded reason.','Recheck the source or ask the user; keep the current location until confirmed.'],zh:['分类待复核','现有分类需要复核，原因记录在档案中。','回看原文或询问用户；确认前保留当前位置。']},
    vocabulary_review:{en:['Vocabulary review','A tag definition or vocabulary relationship changed; existing annotations need review.','Check the current vocabulary and source, then re-annotate after confirming the meaning. Do not move the file automatically.'],zh:['词表待复核','标签定义或词条关系已调整，需要复核原标注。','检查当前词表与原文，确认标签含义后重新标注；不要自动移动文件。']}
  };
  function issueField(item, position) {
    const copy=issueText[item.reason_code];
    return copy ? copy[locale==='zh-CN'?'zh':'en'][position] : (position===0 ? (item.reason_label||item.reason_code) : position===1 ? item.message : item.next_action);
  }
  function renderIssueFilter() {
    const select=$('issue-filter'), selected=select.value;
    select.replaceChildren(); option(select,'',t('allIssueTypes'));
    [...issueTypes].sort((a,b)=>a[1].localeCompare(b[1],locale)).forEach(([id,label])=>option(select,id,issueText[id]?.[locale==='zh-CN'?'zh':'en'][0]||label));
    if([...issueTypes.keys()].includes(selected)) select.value=selected;
  }
  const nodes = new Map();
  const validPath = p => typeof p === 'string' && !p.startsWith('/') && !p.includes('\\') && !p.includes(':') && (p === '' || p.split('/').every(x=>x && x!=='.' && x!=='..'));
  for (const n of (data.directories || [])) if (validPath(n.path)) nodes.set(n.path,{...n});
  if (!nodes.has('')) nodes.set('',{path:'',name:t('allFiles'),parent:null,direct_files:0,subtree_files:files.length,child_directories:0});
  for (const f of files) { let parts=String(f.path||'').split('/'); parts.pop(); while(parts.length) { const path=parts.join('/'); if(validPath(path)&&!nodes.has(path)) nodes.set(path,{path,name:parts[parts.length-1],parent:parts.slice(0,-1).join('/'),direct_files:null,subtree_files:null}); parts.pop(); } }
  function enterFolder(path) { if(!nodes.has(path)) return; folder=path; page=0; selected=null; renderFolderNavigation(); renderFiles(); }
  function renderFolderNavigation() {
    const crumbs=$('breadcrumbs'); crumbs.replaceChildren();
    const parts=folder?folder.split('/'):[];
    const paths=['',...parts.map((_,i)=>parts.slice(0,i+1).join('/'))];
    for(const path of paths) {
      const b=document.createElement('button'); b.type='button';
      text(b,path?(nodes.get(path)?.name||path.split('/').pop()):t('allFiles'));
      if(path===folder)b.setAttribute('aria-current','location');
      b.addEventListener('click',()=>enterFolder(path)); crumbs.append(b);
    }
    const child=$('folder-child'); child.replaceChildren();
    const children=[...nodes.values()].filter(n=>n.path&&n.parent===folder).sort((a,b)=>a.path.localeCompare(b.path,locale));
    option(child,'',t('openChild')+' ('+fmt(children.length)+' '+t('folders')+')');
    for(const n of children) option(child,n.path,n.name+(n.subtree_files==null?'':' · '+fmt(n.subtree_files)+' '+t('filesWord')));
    child.disabled=!children.length;
    text($('folder-range'),t('currentScope')+': '+(folder||t('allFiles'))+' · '+($('folder-scope').value==='direct'?t('directOnly'):t('descendants')));
  }
  $('folder-child').addEventListener('change',()=>{if($('folder-child').value)enterFolder($('folder-child').value)});
  $('folder-scope').addEventListener('change',()=>{page=0;renderFolderNavigation();renderFiles()});
  function renderStats() {
    const stats=[
      [t('statFiles'),data.stats?.active_files,t('activeInventory')],
      [t('classReview'),data.stats?.classification_review_required??files.filter(f=>f.classification_status!=='confident').length,t('inheritedUnclassified')],
      [t('bodyReviewed'),data.stats?.semantic_reviewed,t('withEvidence')],
      [t('needsReview'),issues.length,t('issueRecords')],
      [t('parsingLimited'),data.stats?.parsing_limited,t('causeNext')]
    ];
    $('stats').replaceChildren();
    for(const [label,value,detail] of stats){const d=document.createElement('div');d.className='stat';const a=document.createElement('div');a.className='stat-label';text(a,label);const b=document.createElement('div');b.className='stat-value';text(b,fmt(value));const c=document.createElement('div');c.className='stat-detail';text(c,detail);d.append(a,b,c);$('stats').append(d);}
  }
  const generatedAt=data.generated_at, scannedAt=data.last_scanned_at;
  const revision=data.catalog_revision||(locale==='zh-CN'?'当前':'current');
  const snapshotIncomplete=Boolean(data.scope?.truncated||data.scope?.omitted_count);
  function renderHeader() {
    document.title=locale==='zh-CN'?'本地文件知识库':'Local File Knowledge Base';
    text($('freshness'),t('generated')+' '+(generatedAt||t('unknown'))+' · '+t('scanned')+' '+(scannedAt||t('unknown')));
    text($('library-name'),data.library_name||t('brand'));
    text($('issue-count'),issues.length?'· '+fmt(issues.length):'');
    const rawScenario=data.scenario?.document?.label;
    const scenarioLabel=locale==='zh-CN'&&rawScenario==='General personal files (default)'?'个人综合资料（默认）':(rawScenario||t('generalCandidate'));
    text($('scope-line'),t('scenario')+': '+scenarioLabel+' · '+t('vocabularyRevision')+': '+(data.vocabulary_version||t('legacy'))+' · '+t('browseSummary'));
    $('snapshot-banner').classList.toggle('hidden',!snapshotIncomplete);
    if(snapshotIncomplete) text($('snapshot-banner'),t('snapshotIntro')+' '+fmt(files.length)+' '+t('items')+'; '+fmt(data.scope?.omitted_count)+' '+t('omitted'));
    const stampGenerated=generatedAt||t('unknown'), stampScanned=scannedAt||t('unknown');
    const footnote=locale==='zh-CN'
      ? '页面为 '+revision+' 修订的离线清单快照。页面生成于 '+stampGenerated+'，盘点于 '+stampScanned+'；网页不监视磁盘，也不校验源文件哈希。正文检索由知识库工具执行。'
      : 'Offline inventory snapshot, revision '+revision+'. Generated '+stampGenerated+'; last scanned '+stampScanned+'. This page does not monitor the disk or verify source hashes; use the knowledge-base tool to search file contents.';
    text($('footnote'),footnote);
  }
  function matches() {
    const q=$('q').value.normalize('NFKC').trim().toLocaleLowerCase();
    const cat=$('category-filter').value, typ=$('type-filter').value, sem=$('status-filter').value;
    return files.filter(f=>{
      if($('business-filter').value&&(f.business_state||'unknown')!==$('business-filter').value)return false;
      const parent=String(f.path||'').split('/').slice(0,-1).join('/');
      if($('folder-scope').value==='direct'?parent!==folder:(folder&&!String(f.path||'').startsWith(folder+'/')))return false;
      if(cat&&f.category_id!==cat)return false;
      if(typ&&!(f.tags||[]).some(t=>['document_type','file_type'].includes(t.facet)&&t.label===typ))return false;
      if(sem&&f.semantic_status!==sem)return false;
      if($('format-filter').value&&f.extension!==$('format-filter').value)return false;
      if($('topic-filter').value&&!(f.tags||[]).some(t=>t.facet==='topic'&&t.id===$('topic-filter').value))return false;
      if(q){const s=[f.title,f.name,f.path,f.summary,f.legacy_note,...(f.tags||[]).flatMap(t=>[t.label,t.id,...(t.aliases||[])])].filter(Boolean).join(' ').normalize('NFKC').toLocaleLowerCase();if(!s.includes(q))return false;}
      return true;
    });
  }
  function detail(f) {
    const box=$('inspector');box.replaceChildren();
    const label=document.createElement('p');label.className='detail-label';text(label,t('fileDetails'));
    const h=document.createElement('h2');text(h,f.title||f.name);
    const p=document.createElement('div');p.className='inspector-path';text(p,f.path);box.append(label,h,p);
    const badges=document.createElement('div');badges.className='detail-section';const row=document.createElement('div');row.className='tag-list';
    for(const value of [classLabel(f),semanticLabel(f),extractionLabel(f)]){const b=document.createElement('span');b.className='badge '+(f.semantic_status==='reviewed'?'good':f.semantic_status==='unreviewed'?'warn':'');text(b,value);row.append(b);}
    badges.append(row);box.append(badges);
    const state=f.business_state||'unknown';
    const props=document.createElement('div');props.className='detail-section detail-grid';
    const values=[[t('fileId'),f.file_id],[t('documentType'),f.document_type_label||t('unconfirmed')],[t('format'),f.extension||t('unknown')],[t('vocabularyReview'),f.vocabulary_review_required?t('reviewNeeded'):t('noAction')],[t('size'),f.size_human||''],[t('classificationBasis'),f.classification_basis_label||t('notRecorded')],[t('businessState'),stateLabel(state)],[t('documentVersion'),f.version_label||t('unconfirmed')],[t('versionGroup'),f.version_group||t('unconfirmed')],[t('currentVersion'),f.is_current?t('designatedAtGeneration'):t('notDesignated')],[t('reviewDate'),f.review_on||t('notSet')]];
    for(const [k,v] of values){const cell=document.createElement('div');const l=document.createElement('div');l.className='detail-label';text(l,k);const val=document.createElement('div');val.className='detail-value';text(val,v);cell.append(l,val);props.append(cell);}
    box.append(props);
    if(f.summary){const s=document.createElement('section');s.className='detail-section';const l=document.createElement('div');l.className='detail-label';text(l,f.semantic_status==='partial'?t('partialSummary'):t('contentSummary'));const c=document.createElement('div');c.className='detail-text';text(c,f.summary);s.append(l,c);box.append(s);}
    else if(f.legacy_note){const s=document.createElement('section');s.className='detail-section';const l=document.createElement('div');l.className='detail-label';text(l,t('folderFilenameNote'));const c=document.createElement('div');c.className='detail-text';text(c,f.legacy_note);s.append(l,c);box.append(s);}
    const tags=(f.tags||[]).filter(t=>t.facet!=='file_type');
    if(tags.length){const s=document.createElement('section');s.className='detail-section';const l=document.createElement('div');l.className='detail-label';text(l,t('tags'));const wrap=document.createElement('div');wrap.className='tag-list';for(const tag of tags){const x=document.createElement('span');x.className='tag';text(x,tag.facet+' · '+tag.label);x.title=[tag.definition,tag.aliases?.length?t('aliases')+': '+tag.aliases.join(', '):''].filter(Boolean).join('; ');wrap.append(x);}s.append(l,wrap);box.append(s);}
    const ev=f.evidence||[];
    if(ev.length){const s=document.createElement('section');s.className='detail-section';const l=document.createElement('div');l.className='detail-label';text(l,t('classificationEvidence'));const list=document.createElement('div');list.className='source-list';for(const e of ev){const x=document.createElement('div');x.className='source-item';text(x,safeSource(e));list.append(x);}s.append(l,list);box.append(s);}
    const issueMessages=(f.issue_codes||[]).map(code=>issueText[code]?.[locale==='zh-CN'?'zh':'en'][1]).filter(Boolean).join('\n');
    if(f.read_coverage||issueMessages){const s=document.createElement('section');s.className='detail-section';const l=document.createElement('div');l.className='detail-label';text(l,t('readCoverage'));const c=document.createElement('div');c.className='detail-text';text(c,[f.read_coverage,issueMessages].filter(Boolean).join('\n'));s.append(l,c);box.append(s);}
    const actions=document.createElement('section');actions.className='detail-section copy-row';
    const a=document.createElement('a');a.href=escPath(f.path);a.textContent=t('openSource');a.className='copy-button';a.rel='noreferrer';a.addEventListener('click',e=>{if(!f.path||f.path.split('/').includes('..'))e.preventDefault();});
    const copy=document.createElement('button');copy.type='button';copy.className='copy-button';text(copy,t('copyCitation'));
    const stateNote=document.createElement('span');stateNote.className='copy-state';
    copy.addEventListener('click',async()=>{const citation=t('source')+': '+f.path+'; file_id='+f.file_id+'; '+t('verifyLocator');try{await navigator.clipboard.writeText(citation);text(stateNote,t('copied'));}catch{text(stateNote,citation);}});
    actions.append(a,copy,stateNote);box.append(actions);
  }
  function renderFiles() {
    const all=matches(),start=page*pageSize,shown=all.slice(start,start+pageSize),body=$('file-rows');body.replaceChildren();
    for(const f of shown){
      const tr=document.createElement('tr');tr.className='file-row';tr.tabIndex=0;tr.setAttribute('aria-selected',String(selected===f.file_id));
      const main=document.createElement('td');const title=document.createElement('div');title.className='file-title';text(title,f.title||f.name);
      const path=document.createElement('span');path.className='file-path';text(path,f.path);main.append(title,path);
      const meta=document.createElement('td');const cl=document.createElement('span');cl.className='badge';text(cl,classLabel(f));meta.append(cl);
      const tags=document.createElement('div');tags.className='tag-list';for(const tag of (f.tags||[]).slice(0,3)){const s=document.createElement('span');s.className='tag';text(s,tag.label);tags.append(s);}meta.append(tags);
      const read=document.createElement('td');const status=document.createElement('span');status.className='badge '+(f.semantic_status==='reviewed'?'good':f.semantic_status==='unreviewed'?'warn':'');text(status,semanticLabel(f));read.append(status);
      tr.append(main,meta,read);tr.addEventListener('click',()=>{selected=f.file_id;detail(f);renderFiles();});tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tr.click();}});body.append(tr);
    }
    $('empty-files').classList.toggle('hidden',all.length>0);text($('empty-files'),all.length?'':t('noFilesMatch'));
    text($('result-count'),fmt(all.length)+' '+countUnit(all.length));
    text($('page-label'),all.length?fmt(start+1)+'–'+fmt(Math.min(start+pageSize,all.length))+' / '+fmt(all.length):'0 '+t('items'));
    $('previous').disabled=page===0;$('next').disabled=start+pageSize>=all.length;
    if(!shown.some(f=>f.file_id===selected)){selected=shown[0]?.file_id||null;if(selected)detail(shown[0]);else{$('inspector').replaceChildren();text($('inspector'),t('noMatchingFile'));}}
  }
  function renderIssues() {
    const selectedReason=$('issue-filter').value, rows=issues.filter(x=>!selectedReason||x.reason_code===selectedReason);
    $('issues').replaceChildren();
    for(const item of rows){
      const row=document.createElement('article');row.className='issue';const left=document.createElement('div');
      const path=document.createElement('div');path.className='issue-path';text(path,item.path);
      const reason=document.createElement('div');reason.className='issue-reason';text(reason,issueField(item,0));
      const message=document.createElement('div');message.className='issue-next';text(message,issueField(item,1));
      const next=document.createElement('div');next.className='issue-next';text(next,t('nextStep')+' '+(issueField(item,2)||''));
      left.append(path,reason,message,next);const right=document.createElement('div');right.className='issue-state';
      const certainty=item.certainty==='confirmed'?t('issuesCertainty'):item.certainty==='suspected'?t('suspected'):(item.certainty||'');
      text(right,certainty+' · '+semanticLabel({semantic_status:item.semantic_status}));row.append(left,right);$('issues').append(row);
    }
    $('empty-issues').classList.toggle('hidden',rows.length>0);text($('empty-issues'),rows.length?'':t('noIssues'));text($('issue-result-count'),fmt(rows.length)+' '+countUnit(rows.length));
  }
  function rerender(){renderFolderNavigation();renderStats();renderFiles();renderIssues();}
  $('language-switch').addEventListener('change',()=>{locale=$('language-switch').value==='zh-CN'?'zh-CN':'en';applyLanguage();});
  for(const event of ['input','change']){$('q').addEventListener(event,()=>{page=0;renderFiles();});for(const id of ['category-filter','type-filter','format-filter','topic-filter','status-filter','business-filter'])$(id).addEventListener(event,()=>{page=0;renderFiles();});}
  $('issue-filter').addEventListener('change',renderIssues);
  $('previous').addEventListener('click',()=>{page=Math.max(0,page-1);renderFiles();});
  $('next').addEventListener('click',()=>{page++;renderFiles();});
  document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{view=button.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===button)));$('file-view').classList.toggle('hidden',view!=='files');$('issue-view').classList.toggle('hidden',view!=='issues');}));
  applyLanguage();
})();
</script>
